<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hot Wheels Battleship</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1><span class="flame">Hot Wheels</span> Battleship</h1>
      <p id="status" class="status">Park your cars to begin.</p>
    </header>

    <main>
      <section class="panel" id="setup-panel">
        <h2>Load your garage</h2>
        <p class="hint">
          Pick a car, then click a cell in your garage to park it. Press <kbd>R</kbd> or the
          rotate button to change orientation.
        </p>
        <ul id="ship-list" class="ship-list"></ul>
        <div class="controls">
          <button id="rotate-btn" type="button">Rotate: Horizontal</button>
          <button id="random-btn" type="button">Randomize</button>
          <button id="start-btn" type="button" disabled>Start the race</button>
        </div>
      </section>

      <section class="boards">
        <div class="board-wrap">
          <h2>Your garage</h2>
          <div id="player-board" class="board" aria-label="Your board"></div>
          <p class="fleet-status" id="player-fleet"></p>
          <p class="counter">Rival launches: <span id="enemy-shots">0</span></p>
        </div>
        <div class="board-wrap">
          <h2>Rival track</h2>
          <div id="enemy-board" class="board board--enemy" aria-label="Rival board"></div>
          <p class="fleet-status" id="enemy-fleet"></p>
          <p class="counter">Your launches: <span id="player-shots">0</span></p>
        </div>
      </section>

      <section class="panel">
        <div class="controls">
          <button id="restart-btn" type="button">New Race</button>
        </div>
        <ol id="log" class="log" aria-live="polite"></ol>
      </section>
    </main>

    <script src="src/game.js"></script>
    <script src="src/ai.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
